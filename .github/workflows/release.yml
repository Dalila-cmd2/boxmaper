name: Publicar versión

# Se ejecuta al subir una etiqueta tipo v1.0.0 (o a mano desde la pestaña Actions).
# Genera los instaladores de Windows, macOS y Linux, los sube a "Releases"
# y crea el archivo latest.json que usa la app para actualizarse sola.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: windows-latest
            args: ""
          - plataforma: macos-latest
            args: "--target aarch64-apple-darwin"
          - plataforma: macos-latest
            args: "--target x86_64-apple-darwin"
          - plataforma: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.plataforma }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Caché de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependencias de la app
        run: npm ci

      - name: Compilar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BoxMaper ${{ github.ref_name }}"
          releaseBody: |
            ## BoxMaper ${{ github.ref_name }}

            - **Windows 10/11**: descarga el archivo `.exe` (instalador) y ábrelo.
            - **macOS**: descarga el `.dmg` (Apple Silicon o Intel).
            - **Linux**: descarga el `.AppImage` o el `.deb`.

            Si ya tienes BoxMaper instalado, se actualizará solo al abrirlo.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
